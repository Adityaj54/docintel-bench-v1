name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install ".[test]"

      - name: Lint
        run: ruff check app tests

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  migrations:
    name: Migrations against an empty PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.8-bookworm
        env:
          POSTGRES_USER: docintel
          POSTGRES_DB: docintel
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docintel -d docintel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://docintel@localhost:5432/docintel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install ".[test]"

      - name: Upgrade from empty
        run: alembic upgrade head

      - name: Downgrade is reversible
        run: alembic downgrade base

      - name: Upgrade again
        run: alembic upgrade head

      - name: No model changes are missing a migration
        run: |
          alembic revision --autogenerate -m "drift check" --rev-id cidrift
          if grep -qE '^\s+op\.' alembic/versions/cidrift_*.py; then
            echo "::error::The models have changed without a migration. Generated operations:"
            grep -E '^\s+op\.' alembic/versions/cidrift_*.py
            exit 1
          fi

  stack:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the API to report ready
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health/ready > /dev/null; then
              echo "API ready after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The API never became ready."
          docker compose ps
          docker compose logs --no-color --tail 200
          exit 1

      - name: Wait for the frontend to be served
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend serving after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The frontend never started serving."
          docker compose ps
          docker compose logs --no-color --tail 200 frontend
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Tear down
        if: always()
        run: docker compose down --volumes
