[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel-bench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.40",
  "alembic==1.15.2",
  "psycopg[binary]==3.2.6",
  "redis==5.2.1",
  "celery==5.5.1",
  "pydantic==2.11.3",
  "pydantic-settings==2.8.1",
  "python-multipart==0.0.20",
  "argon2-cffi==23.1.0",
  "PyJWT==2.10.1",
  "jsonschema==4.23.0",
  "httpx==0.28.1",
  "Pillow==11.2.1",
  "PyMuPDF==1.25.5",
  "boto3==1.37.38",
  "email-validator==2.2.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-cov==6.1.1", "ruff==0.11.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-report=xml --cov-report=lcov"

[tool.coverage.run]
source = ["app"]
branch = true
# The measurement database is a SQLite file; keep it out of the tree so only the
# text reports below are ever checked in or archived.
data_file = "${TMPDIR-/tmp}/docintel-coverage/data"

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.coverage.lcov]
output = "coverage/lcov.info"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
